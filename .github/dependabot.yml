version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      k8s.io:
        patterns:
          - "k8s.io/*"
      go.etcd.io:
        patterns:
          - "go.etcd.io/etcd/*"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      codeql:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 20
